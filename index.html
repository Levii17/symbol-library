  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A library of electrical schematic symbols following SANS and IEC conventions."
    />
    <title>Electrical Symbols Preview</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="page-header">
        <h1>Electrical Symbols with Connection Points</h1>
        <p class="legend">
          <span class="legend-item"><span class="dot dot-input"></span> Input Terminals</span>
          <span class="legend-item"><span class="dot dot-output"></span> Output Terminals</span>
          <span class="legend-item"><span class="dot dot-io"></span> I/O Terminals</span>
        </p>
        <div class="toolbar">
          <input
            type="search"
            id="symbol-search"
            class="search-input"
            placeholder="Search symbols…"
            aria-label="Search symbols"
          />
        </div>
      </header>

      <main id="symbols-container" class="symbols-grid" aria-live="polite">
        <!-- Symbols are injected here by src/js/app.js -->
      </main>

      <p id="empty-state" class="empty-state" hidden>No symbols match your search.</p>
    </div>

    <footer class="site-footer">
      <div>
        created by <a href="https://github.com/levii17">Mxolisi</a>, checkout my Github if you feel
        so inclined.😴
      </div>
    </footer>

    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>
